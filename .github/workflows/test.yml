name: Test

on:
    push:
        branches: '*'
    pull_request:
        branches: [main]
    workflow_dispatch:

jobs:
    test:
        runs-on: ubuntu-latest
        permissions:
            contents: read
        timeout-minutes: 10
        strategy:
            fail-fast: false
            matrix:
                node-version: [26, 25, 24, 22, 20, 18, 16, 14, 12, 10, 8]
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: 'npm'

            - name: Install dependencies
              if: ${{ matrix.node-version >= 8 }}
              run: npm ci

            - name: Install dependencies (node < 8)
              if: ${{ matrix.node-version < 8 }}
              run: npm install --only=prod

            - name: Run unit tests
              if: ${{ matrix.node-version >= 20 }}
              run: npm test

            - name: Run unit tests (node < 20)
              if: ${{ matrix.node-version < 20 }}
              run: node scripts/legacy-test-runner.js

            # TypeScript is pinned to 6.x. TypeScript 7 (the Go rewrite) reduced its
            # CommonJS entry point to `lib/version.cjs` — `transpileModule` and
            # `ModuleKind`, which lib/compiler.js uses, are gone, and the replacement
            # lives behind the explicitly unstable `typescript/unstable/*` subpaths.
            # 6.0.3 is the last release with the classic API. Supporting TS 7 is
            # tracked separately; unpinning before then just breaks the job.
            - name: Run unit tests (compilers)
              if: ${{ matrix.node-version >= 20 }}
              run: npm install typescript@6 coffee-script --no-save && npm run test:compilers

    bun:
        # Bun is EXPERIMENTAL for vm2 and is NOT a supported security boundary.
        # See docs/specs/2026-08-30-bun-support-design.md section 6.
        #
        # A separate job, deliberately not a matrix entry: the Node matrix is
        # fail-fast and a Bun entry inside it could cancel in-flight Node jobs.
        runs-on: ubuntu-latest
        continue-on-error: true
        permissions:
            contents: read
        timeout-minutes: 15
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node (for npm ci and the completeness checker)
              uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: 'npm'

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  # Pinned deliberately. Every divergence reason in
                  # test/bun-skips.js cites behaviour of this exact version, so
                  # a floating version would make those reasons unverifiable.
                  # Bumping is a reviewed PR that shows which skips changed.
                  bun-version: 1.4.0

            - name: Install dependencies
              run: npm ci

            - name: Run unit tests under Bun
              # --require ./test/bun-setup.js applies test/bun-skips.js. It must
              # come from the flag, not from inside a spec file: test/ghsa loads
              # first, so nothing a spec file installs can reach it.
              run: bun ./node_modules/mocha/bin/mocha.js test --recursive --ignore test/compilers.js --require ./test/bun-setup.js --reporter tap | tee bun-tap.txt
              continue-on-error: true

            - name: Verify the run actually finished
              # The important step. Without it a mid-run crash exits 0 and the
              # job reports a success it never verified.
              run: node scripts/check-run-complete.js bun-tap.txt --min-tests 800

            - name: Report skip count
              if: always()
              run: |
                  echo "Bun skips (phase-2 backlog): $(grep -c '# SKIP' bun-tap.txt || true)"
