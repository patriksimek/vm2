name: Bun canary

# Informational only. Runs the suite on the LATEST Bun with the skip list
# disabled, to reveal which entries in test/bun-skips.js Bun has since fixed.
# Never gates anything.

on:
    schedule:
        - cron: '0 6 * * 1'
    workflow_dispatch:

jobs:
    canary:
        runs-on: ubuntu-latest
        continue-on-error: true
        permissions:
            contents: read
        timeout-minutes: 20
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: 'npm'

            - name: Setup Bun (latest)
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            - name: Install dependencies
              run: npm ci

            - name: Run with skips disabled
              env:
                  VM2_BUN_NO_SKIP: '1'
              run: bun ./node_modules/mocha/bin/mocha.js test --recursive --ignore test/compilers.js --require ./test/bun-setup.js --reporter tap | tee canary-tap.txt
              continue-on-error: true

            - name: Summarise
              if: always()
              run: |
                  echo "Bun version: $(bun --version)"
                  echo "Failures with skips disabled:"
                  grep '^not ok' canary-tap.txt || echo "  none - every skip in test/bun-skips.js is now stale"
