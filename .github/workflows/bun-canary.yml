name: Bun canary

# Informational only. Runs the suite on the LATEST Bun with the skip list
# disabled, to reveal which entries in test/bun-skips.js Bun has since fixed.
# Never gates anything.

on:
    schedule:
        - cron: '0 6 * * 1'
    workflow_dispatch:

jobs:
    canary:
        runs-on: ubuntu-latest
        continue-on-error: true
        permissions:
            contents: read
        timeout-minutes: 30
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: 'npm'

            - name: Setup Bun (latest)
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            - name: Install dependencies
              run: npm ci

            - name: Run with skips disabled
              env:
                  VM2_BUN_NO_SKIP: '1'
              # Entries flagged `neverUnskip` in test/bun-skips.js stay skipped
              # even here: they hang for many minutes or kill the process, and
              # leaving them enabled would stop this job ever reaching its
              # summary. They are probed one at a time in the next step instead.
              run: |
                  set -o pipefail
                  bun ./node_modules/mocha/bin/mocha.js test --recursive --ignore test/compilers.js --require ./test/bun-setup.js --reporter tap | tee canary-tap.txt
                  echo "$?" > canary-exit.txt
              continue-on-error: true

            - name: Probe the never-unskip entries individually
              if: always()
              continue-on-error: true
              # Every `neverUnskip` entry in test/bun-skips.js gets its own
              # bounded run. Each probe is judged by the completeness checker,
              # not by grepping for `not ok`: a probe that dies with no epilogue
              # emits no `not ok` line either, and reporting that as "NOW
              # PASSES" would be the same dishonest green this PR exists to
              # stop.
              run: |
                  probe() {
                      label="$1"; file="$2"; pattern="$3"
                      echo "--- $label"
                      set +e
                      set -o pipefail
                      if [ -n "$pattern" ]; then
                          timeout 180s bun ./node_modules/mocha/bin/mocha.js "$file" --reporter tap --grep "$pattern" > probe.txt 2>&1
                      else
                          timeout 180s bun ./node_modules/mocha/bin/mocha.js "$file" --reporter tap > probe.txt 2>&1
                      fi
                      status=$?
                      if [ "$status" -eq 124 ]; then
                          echo "    timed out after 180s — skip remains justified"
                          return
                      fi
                      if ! node scripts/check-run-complete.js probe.txt --runner-exit "$status" > probe-check.txt 2>&1; then
                          echo "    run was not trustworthy — no conclusion drawn:"
                          sed 's/^/      /' probe-check.txt
                          return
                      fi
                      echo "    NOW PASSES — this skip may be stale"
                  }

                  # Keep in step with the `neverUnskip` entries in
                  # test/bun-skips.js. Each is probed separately even where two
                  # appear to share a root cause, because "appears to" is not
                  # evidence.
                  probe "GHSA-v27g (terminates the process)" test/ghsa/GHSA-v27g-jcqj-v8rw/repro.js ""
                  probe "GHSA-6785 bufferAllocLimit: Infinity (>17 min)" test/ghsa/GHSA-6785-pvv7-mvg7/repro.js "bufferAllocLimit: Infinity disables the cap"
                  probe "GHSA-6785 permissive default 64MB (>400s)" test/ghsa/GHSA-6785-pvv7-mvg7/repro.js "default is permissive"
                  probe "unbounded recursion: prepareStackTrace" test/vm.js "Node internal prepareStackTrace attack"
                  probe "unbounded recursion: transformer attack" test/vm.js "transformer attack"

            - name: Summarise
              if: always()
              run: |
                  echo "Bun version: $(bun --version)"
                  echo ""
                  # The summary is only meaningful if the run actually finished.
                  # A crashed run emits no `not ok` lines, which is
                  # indistinguishable from a clean one by grep alone -- so it
                  # would otherwise report "everything is stale" precisely when
                  # it knows least.
                  if node scripts/check-run-complete.js canary-tap.txt --runner-exit "$(cat canary-exit.txt 2>/dev/null || echo missing)" > /dev/null 2>&1; then
                      echo "Run completed and is self-consistent. Failures with skips disabled:"
                      grep '^not ok' canary-tap.txt || echo "  none - every non-hanging entry in test/bun-skips.js is now stale"
                  else
                      echo "RUN DID NOT COMPLETE - no staleness conclusion can be drawn from it."
                      node scripts/check-run-complete.js canary-tap.txt --runner-exit "$(cat canary-exit.txt 2>/dev/null || echo missing)" || true
                      echo ""
                      echo "Any 'not ok' lines it did emit before stopping:"
                      grep '^not ok' canary-tap.txt || echo "  (none emitted before the run stopped)"
                  fi
